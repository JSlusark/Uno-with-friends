name: web
on:  # events that trigger this workflow
  pull_request: # runs on any PR and on pushes to main (i.e. merged PRs); skipped if web files weren't touched
    paths: ["apps/web/**", ".github/workflows/web.yaml"]
  push:
    branches: [main]
    paths: ["apps/web/**", ".github/workflows/web.yaml"]
jobs:
  ci:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web # to avoid executing at root
    steps: 
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          {
            node-version: 24,
            cache: npm,
            cache-dependency-path: apps/web/package-lock.json,
          }
      - run: npm ci
      - run: npm run lint
      - run: npm run test # runs vitest unit tests
      - run: npm run build # tsc -b && vite build, so this also typechecks
